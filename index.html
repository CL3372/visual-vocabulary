<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LexPix" />
    <meta name="description" content="Learn 4,000+ words in 42 languages through beautiful photography. Free visual vocabulary app covering food, verbs, emotions, numbers, family and more — in Spanish, Hindi, French, Japanese, Arabic and beyond." />
    <link rel="canonical" href="https://lexpix.io/" />
    <link rel="manifest" href="/manifest.json" />
    <title>LexPix — Learn 4,000+ words in 42 languages with photos</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lexpix.io/" />
    <meta property="og:title" content="LexPix — Learn 4,000+ words in 42 languages" />
    <meta property="og:description" content="Free visual vocabulary app. Explore 100+ categories — food, verbs, emotions, numbers, family and more — in Spanish, French, Hindi, Japanese, Arabic and more." />
    <meta property="og:site_name" content="LexPix" />
    <meta property="og:image" content="https://lexpix.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LexPix — learn 4,000+ words in 42 languages with photos" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LexPix — Learn 4,000+ words in 42 languages" />
    <meta name="twitter:description" content="Free visual vocabulary app. Beautiful photos + 42 languages. Food, verbs, emotions, numbers and more." />
    <meta name="twitter:image" content="https://lexpix.io/og-image.png" />
    <meta name="twitter:image:alt" content="LexPix — learn 4,000+ words in 42 languages with photos" />

    <!-- Google Analytics 4 — set VITE_GA_MEASUREMENT_ID in Vercel env vars -->
    <script>
      (function() {
        var id = '%VITE_GA_ID%';
        if (!id || id === '%VITE_GA_ID%') return;
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        s.async = true;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){ window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', id, { anonymize_ip: true });
      })();
    </script>

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "LexPix",
      "url": "https://lexpix.io",
      "description": "Learn 4,000+ vocabulary words in 42 languages through beautiful photography. Covers food, verbs, emotions, numbers, family, occupations, weather and more.",
      "applicationCategory": "EducationalApplication",
      "image": "https://lexpix.io/og-image.png",
      "installUrl": "https://play.google.com/store/apps/details?id=com.visualvocabulary.app",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "inLanguage": ["en", "es", "pt", "pt-BR", "fr", "de", "it", "hi", "ru", "tr", "ja", "zh", "zh-TW", "ko", "ar", "pl", "cs", "ro", "nl", "sv", "el", "id", "vi", "th", "nb", "da", "fi", "fil", "uk", "he", "ms", "bn", "ta", "hu", "sk", "bg", "hr", "sr", "lt", "lv", "ur", "sw"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

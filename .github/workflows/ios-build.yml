name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PEXELS_API_KEY: ${{ secrets.VITE_PEXELS_API_KEY }}
          VITE_STRIPE_PAYMENT_LINK: ${{ secrets.VITE_STRIPE_PAYMENT_LINK }}
          VITE_STRIPE_ANNUAL_LINK: ${{ secrets.VITE_STRIPE_ANNUAL_LINK }}
          VITE_REVENUECAT_IOS_API_KEY: ${{ secrets.VITE_REVENUECAT_IOS_API_KEY }}
        run: npm run build

      - name: Check dist index.html
        run: |
          echo "=== dist/index.html tail ==="
          tail -10 dist/index.html

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Patch Xcode signing settings
        run: |
          python3 << 'PYEOF'
          import re

          path = "ios/App/App.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()

          # Fix ProvisioningStyle in TargetAttributes
          content = content.replace("ProvisioningStyle = Automatic;", "ProvisioningStyle = Manual;")
          # Fix CODE_SIGN_STYLE
          content = content.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          # Fix CODE_SIGN_IDENTITY
          content = content.replace('CODE_SIGN_IDENTITY = "iPhone Developer";', 'CODE_SIGN_IDENTITY = "Apple Distribution";')
          # Remove any existing profile/team settings to avoid conflicts
          content = re.sub(r'\s*PROVISIONING_PROFILE_SPECIFIER = [^;]+;', '', content)
          content = re.sub(r'\s*PROVISIONING_PROFILE = [^;]+;', '', content)
          content = re.sub(r'\s*DEVELOPMENT_TEAM = [^;]+;', '', content)

          # Inject into Release target config only (504EC3181FED79650016851F)
          inject = (
              '\n\t\t\t\tDEVELOPMENT_TEAM = NT793MJZMN;'
              '\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "LexPix AppStore";'
          )
          # Replace in Release config block (identified by MARKETING_VERSION near PRODUCT_BUNDLE_IDENTIFIER)
          content = content.replace(
              "PRODUCT_BUNDLE_IDENTIFIER = io.lexpix.app;",
              "PRODUCT_BUNDLE_IDENTIFIER = io.lexpix.app;" + inject
          )

          with open(path, "w") as f:
              f.write(content)

          print("Patched. Signing settings:")
          for line in content.splitlines():
              if any(k in line for k in ["CODE_SIGN", "DEVELOPMENT_TEAM", "PROVISIONING", "ProvisioningStyle"]):
                  print(line)
          PYEOF

      - name: Install Apple certificate and provisioning profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db
          echo "=== Certificates ==="
          security find-identity -v -p codesigning
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/b16426b9-8257-444d-a3e7-c8bb16cb0166.mobileprovision
          echo "=== Profiles ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Replace iOS public with dist output (safe copy)
        run: |
          set -euo pipefail
          SRC="dist"
          DEST="ios/App/App/public"
          test -f "$SRC/index.html" || { echo "Missing $SRC/index.html"; exit 1; }
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRC/." "$DEST/"
          echo "=== verify copied index includes module script ==="
          grep -n '<script type="module"' "$DEST/index.html" || {
            echo "ERROR: module script missing in copied index.html"
            tail -n 30 "$SRC/index.html"
            exit 1
          }
          echo "=== copied assets ==="
          ls -la "$DEST/assets"

      - name: Build iOS app (signed)
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/LexPix.xcarchive \
            DEVELOPMENT_TEAM=$IOS_TEAM_ID \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive 2>&1 | tee /tmp/xcodebuild.log
          ls -la $RUNNER_TEMP/LexPix.xcarchive || echo "Archive NOT created"

      - name: Export IPA
        run: |
          set -o pipefail
          cat > $RUNNER_TEMP/ExportOptions.plist << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>NT793MJZMN</string>
            <key>provisioningProfileSpecifier</key>
            <string>LexPix AppStore</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.lexpix.app</key>
              <string>b16426b9-8257-444d-a3e7-c8bb16cb0166</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLISTEOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LexPix.xcarchive" \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export 2>&1
          ls -la $RUNNER_TEMP/export/ || echo "Export folder empty"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexPix-iOS
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

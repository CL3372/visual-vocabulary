name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Patch Xcode signing settings
        run: |
          python3 << 'PYEOF'
          import re

          path = "ios/App/App.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()

          content = content.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          content = content.replace("ProvisioningStyle = Automatic;", "ProvisioningStyle = Manual;")
          content = content.replace('CODE_SIGN_IDENTITY = "iPhone Developer";', 'CODE_SIGN_IDENTITY = "Apple Distribution";')
          content = re.sub(r'\s*PROVISIONING_PROFILE_SPECIFIER = [^;]+;', '', content)
          content = re.sub(r'\s*PROVISIONING_PROFILE = [^;]+;', '', content)
          content = re.sub(r'\s*DEVELOPMENT_TEAM = [^;]+;', '', content)

          inject = (
              '\n\t\t\t\tDEVELOPMENT_TEAM = NT793MJZMN;'
              '\n\t\t\t\tPROVISIONING_PROFILE = "b16426b9-8257-444d-a3e7-c8bb16cb0166";'
          )
          content = content.replace(
              "PRODUCT_BUNDLE_IDENTIFIER = io.lexpix.app;",
              "PRODUCT_BUNDLE_IDENTIFIER = io.lexpix.app;" + inject
          )

          with open(path, "w") as f:
              f.write(content)

          print("Done. Signing settings now:")
          for line in content.splitlines():
              if any(k in line for k in ["CODE_SIGN", "DEVELOPMENT_TEAM", "PROVISIONING"]):
                  print(line)
          PYEOF

      - name: Install Apple certificate and provisioning profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          # Add our keychain to the search list WITHOUT removing the login keychain
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db
          echo "=== Certificates in keychain ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/b16426b9-8257-444d-a3e7-c8bb16cb0166.mobileprovision
          echo "=== Installed profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "=== Profile UUID check ==="
          strings ~/Library/MobileDevice/Provisioning\ Profiles/b16426b9-8257-444d-a3e7-c8bb16cb0166.mobileprovision | grep -E "UUID|Name|TeamIdentifier" | head -10

      - name: Build iOS app (signed)
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/LexPix.xcarchive \
            DEVELOPMENT_TEAM=$IOS_TEAM_ID \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="b16426b9-8257-444d-a3e7-c8bb16cb0166" \
            archive 2>&1 | tee /tmp/xcodebuild.log
          ls -la $RUNNER_TEMP/LexPix.xcarchive || echo "Archive NOT created"

      - name: Export IPA
        run: |
          set -o pipefail
          cat > $RUNNER_TEMP/ExportOptions.plist << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>NT793MJZMN</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLISTEOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LexPix.xcarchive" \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export 2>&1
          ls -la $RUNNER_TEMP/export/ || echo "Export folder empty"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexPix-iOS
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
